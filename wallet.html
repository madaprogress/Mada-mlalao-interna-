<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet Principal</title><style>body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;padding:20px}nav a{display:inline-block;background:#334155;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;margin:4px}input,select{width:90%;max-width:320px;padding:12px;margin:6px;border-radius:10px;border:0}button{padding:12px 18px;border:0;border-radius:10px;background:#22c55e;color:#fff;font-weight:700;margin:6px}.card{background:#1e293b;padding:18px;border-radius:16px;max-width:420px;margin:15px auto}.w{border:1px solid #334155;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;word-break:break-all;text-align:left}</style></head><body><h1>💰 WALLET PRINCIPAL</h1><nav><a href="/">👤 Espace Membre</a><a href="/wallet.html">💰 Wallet Principal</a><a href="/admin.html">🔐 Admin</a></nav><div class="card"><h2>Commission Totale: <span id="comm">0</span> USD</h2><p>Total Depots: <span id="tot">0</span> USD</p><p>Ny membre rehetra mahita ireo adresses ireo - Depot eto - 10% automatique ho an'ny Principal</p><div id="list">Chargement...</div><hr><h3>Declarer Depot</h3><select id="m"><option>T.BEP20 - USD</option><option>T.TRC20 - USD</option><option>BNB</option><option>TRX</option><option>Yas - Paul</option><option>Airtel - Jean Romario</option><option>Orange - Jean Romario</option></select><input id="a" type="number" placeholder="Montant"><input id="r" placeholder="Reference"><button onclick="dep()">Declarer</button><p id="msg"></p></div><script>let t=localStorage.getItem('token')||'';async function load(){const w=await fetch('/api/wallets').then(r=>r.json());list.innerHTML=w.wallets.map(x=>`<div class="w"><span><b>${x.network}</b><br>${x.address||'Contact Admin'}</span><button onclick="navigator.clipboard.writeText('${x.address||''}');alert('Copie!')">Copy</button></div>`).join('');const p=await fetch('/api/principal-wallet').then(r=>r.json());comm.innerText=p.principal.total_commission;tot.innerText=p.principal.total_deposits}async function dep(){if(!t) return msg.innerText='Connectez-vous d abord dans Espace Membre';const res=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({method:m.value,amount:a.value,reference:r.value})});const j=await res.json();msg.innerText=j.message}load()</script></body></html>
