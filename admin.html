<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;padding:20px}nav a{display:inline-block;background:#334155;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;margin:4px}input{width:90%;max-width:320px;padding:12px;margin:6px;border-radius:10px;border:0}button{padding:10px 14px;border:0;border-radius:10px;background:#22c55e;color:#fff;font-weight:700;margin:4px}.card{background:#1e293b;padding:18px;border-radius:16px;max-width:500px;margin:15px auto}.row{border:1px solid #334155;padding:10px;border-radius:10px;margin:6px 0;text-align:left}.notif{background:#f59e0b;color:#000}</style></head><body><h1>🔐 ADMIN <span id="bell"></span></h1><nav><a href="/">👤 Membre</a><a href="/wallet.html">💰 Wallet</a><a href="/admin.html">🔐 Admin</a></nav><div class="card"><input id="key" type="password" placeholder="ADMIN_API_KEY"><button onclick="load()">Se connecter</button><p id="msg"></p><h3>🔔 Notifications Automatiques</h3><div id="notifs"></div><h3>Depots</h3><div id="dep"></div><h3>Retraits</h3><div id="with"></div><h3>Wallet Principal</h3><div id="princ"></div></div><script>async function load(){const h={'x-admin-key':key.value};const n=await fetch('/api/admin/notifications',{headers:h}).then(r=>r.json());if(n.message) return msg.innerText=n.message;bell.innerText=n.unread?`🔔 ${n.unread} NOUVEAU`:'';msg.innerText='Connecte OK';notifs.innerHTML=n.notifications.map(x=>`<div class="row notif">${x.message}<br><small>${x.created_at}</small></div>`).join('')||'Aucune';const d=await fetch('/api/admin/deposits',{headers:h}).then(r=>r.json());dep.innerHTML=d.deposits.map(x=>`<div class="row">${x.nom} - ${x.method} - ${x.amount} USD - Comm: ${x.commission} - ${x.status} <button onclick="val('deposit',${x.id},'approve')">✅</button><button onclick="val('deposit',${x.id},'reject')">❌</button></div>`).join('');const w=await fetch('/api/admin/withdrawals',{headers:h}).then(r=>r.json());with.innerHTML=w.withdrawals.map(x=>`<div class="row">${x.nom} - ${x.method} - ${x.amount} - ${x.status} <button onclick="val('withdraw',${x.id},'approve')">✅</button><button onclick="val('withdraw',${x.id},'reject')">❌</button></div>`).join('');const p=await fetch('/api/principal-wallet').then(r=>r.json());princ.innerHTML=`Commission Totale: ${p.principal.total_commission} USD - Total Depots: ${p.principal.total_deposits} USD`;setTimeout(load,10000)}async function val(type,id,action){await fetch('/api/admin/validate',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key.value},body:JSON.stringify({type,id,action})});load()}</script></body></html>
