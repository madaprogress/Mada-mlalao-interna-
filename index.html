<script>
let authToken=sessionStorage.getItem("mada_token")||"";
let member=null;
let availableDepositWallets=[];

async function api(path,method="GET",data=null){
  let o={method,headers:{"Content-Type":"application/json"}};
  if(authToken) o.headers.Authorization="Bearer "+authToken;
  if(data) o.body=JSON.stringify(data);
  let controller=new AbortController();
  let timeout=setTimeout(()=>controller.abort(),15000);
  o.signal=controller.signal;
  try{
    let r=await fetch("/api"+path,o);
    clearTimeout(timeout);
    let text=await r.text();
    let j={}; try{j=JSON.parse(text);}catch(e){j={message:text.slice(0,200)}}
    if(!r.ok) throw new Error(j.message||("Erreur "+r.status));
    return j;
  }catch(e){
    clearTimeout(timeout);
    if(e.name==="AbortError") throw new Error("Serveur tsy mamaly - jereo Logs @ Render - DB mbola tsy mandeha?");
    throw e;
  }
}

function showAuth(m){
  document.getElementById("registerForm").classList.toggle("hidden",m!=="register");
  document.getElementById("loginForm").classList.toggle("hidden",m!=="login");
  document.getElementById("tabRegister").classList.toggle("active",m==="register");
  document.getElementById("tabLogin").classList.toggle("active",m==="login");
}
function showAdminBox(){document.getElementById("adminLoginBox").classList.remove("hidden");}

function cleanPhone(phone,cc){
  let p=phone.replace(/[\s\-\.]/g,"");
  if(p.startsWith("+")) p=p.slice(1);
  if(p.startsWith("261")) p=p.slice(3);
  if(p.startsWith("0")) p=p.slice(1);
  return p;
}

async function register(){
  let name=document.getElementById("regName").value.trim();
  let cc=document.getElementById("countryCode").value;
  let phone=document.getElementById("regPhone").value.trim();
  let pw=document.getElementById("regPassword").value;
  let cf=document.getElementById("regConfirm").value;
  let wp=document.getElementById("regWithdrawPassword").value;
  let msg=document.getElementById("registerMessage");
  msg.style.color="#b91c1c";
  if(!name||!phone||!pw||!wp){msg.textContent="Fenoy daholo ny saha rehetra.";return;}
  if(pw!==cf){msg.textContent="Tsy mitovy ny tenimiafina.";return;}
  if(pw.length<4||wp.length<4){msg.textContent="4 caracteres farafahakeliny.";return;}
  let clean=cleanPhone(phone,cc);
  if(clean.length<9){msg.textContent="Numero tsy feno - ohatra 340262175";return;}
  msg.style.color="#159447";
  msg.textContent="⏳ Miandry serveur... aza mikitika...";
  try{
    let r=await api("/register","POST",{nom:name,pays:"Madagascar",numero:"+261"+clean,password:pw,confirmPassword:cf,withdrawalPassword:wp});
    msg.textContent="✅ "+(r.message||"Vita! Afaka miditra ianao.");
    alert("✅ Compte voa-créer! Midira izao.");
    showAuth("login");
    document.getElementById("loginPhone").value="+261"+clean;
  }catch(e){
    msg.style.color="#b91c1c";
    msg.textContent="❌ "+e.message;
    alert("❌ "+e.message);
  }
}

async function login(){
  let phone=document.getElementById("loginPhone").value.trim();
  let pw=document.getElementById("loginPassword").value;
  let msg=document.getElementById("loginMessage");
  if(!phone||!pw){msg.textContent="Ampidiro ny laharana sy tenimiafina.";return;}
  msg.textContent="⏳ Miandry...";
  try{
    let clean=cleanPhone(phone,"+261");
    // Andramo @ format 2 - raha tsy mety ny iray, andramo ny iray
    let r;
    try{ r=await api("/login","POST",{numero:"+261"+clean,password:pw}); }
    catch(e1){ r=await api("/login","POST",{numero:clean,password:pw}); }
    if(!r.token) throw new Error("Tsy nahazo token.");
    authToken=r.token; sessionStorage.setItem("mada_token",authToken);
    member=r.user||{}; enterMember();
  }catch(e){msg.textContent="❌ "+e.message; alert("❌ "+e.message);}
}

function enterMember(){

  document.getElementById("accountPhone").textContent=member.numero||"-";
  document.getElementById("inviteLink").value=location.origin+"/?ref="+(member.id||"");
  navigate("Home"); refreshBalance(); loadMyAddress();
