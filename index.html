<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADA MLALAO INTERNA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9;color:#111}
header{background:#0f172a;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{margin:0 0 10px}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:800;font-size:15px;margin-top:8px;cursor:pointer}
button.blue{background:#2563eb}button.dark{background:#0f172a}button.orange{background:#ea580c}button.grey{background:#64748b}
.tabs{display:flex;gap:8px} .tabs button{flex:1;background:#e2e8f0;color:#111} .tabs button.active{background:#0f172a;color:#fff}
.nav{display:flex;gap:6px;flex-wrap:wrap} .nav button{flex:1 1 30%;background:#e2e8f0;color:#111;padding:10px;font-size:13px} .nav button.active{background:#16a34a;color:#fff}
.hidden{display:none!important}.msg{font-size:14px;min-height:20px;margin-top:6px}.bal{font-size:32px;font-weight:900;color:#16a34a;text-align:center}
.wallet{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:6px 0;background:#f8fafc}.wallet b{display:block}.small{font-size:12px;color:#64748b;word-break:break-all}
.item{border-bottom:1px solid #eee;padding:8px 0;font-size:14px}
.admin{background:#fff7ed}
</style>
</head>
<body>
<header>🌍 MADA MLALAO INTERNA</header>
<div class="wrap">

<!-- AUTH -->
<div id="authScreen">
<div class="card">
<div class="tabs"><button id="tabRegister" class="active" onclick="showAuth('register')">MISORATRA</button><button id="tabLogin" onclick="showAuth('login')">MIDITRA</button></div>

<div id="registerForm">
<h2>Misoratra</h2>
<input id="regName" placeholder="Anarana feno">
<input id="regPhone" placeholder="Numero - ohatra 340262175">
<input id="regPassword" type="password" placeholder="Mot de passe (4+)">
<input id="regConfirm" type="password" placeholder="Confirmer mot de passe">
<input id="regWithdrawPassword" type="password" placeholder="Mot de passe retrait (4+)">
<button onclick="register()">MISORATRA</button>
<div id="registerMessage" class="msg"></div>
</div>

<div id="loginForm" class="hidden">
<h2>Miditra</h2>
<input id="loginPhone" placeholder="+261...">
<input id="loginPassword" type="password" placeholder="Mot de passe">
<button onclick="login()">MIDITRA</button>
<div id="loginMessage" class="msg"></div>
</div>
</div>
<div class="card"><button class="grey" onclick="showAdminBox()">ADMIN - Tsindrio eto</button>
<div id="adminLoginBox" class="hidden"><input id="adminKeyInput" placeholder="Admin Key"><button class="dark" onclick="adminLogin()">HIDITRA ADMIN</button><div id="adminLoginMsg" class="msg"></div></div>
</div>
</div>

<!-- MEMBER -->
<div id="memberScreen" class="hidden">
<div class="card"><div style="display:flex;justify-content:space-between"><b id="accountName">-</b><button
